services:
  - type: worker
    name: elara-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ELARA_AUTO_START
        value: "true"
      - key: ELARA_PROVIDER
        sync: false
      - key: TELEGRAM_OFFICIAL_CHANNEL
        value: "@elarapairgc"
      - key: BOT_TOKEN
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: STARTUP_PASSWORD
        sync: false
